services:
  - type: web
    name: pitch-fork-mcp-server
    runtime: node
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # Optional: set both to require WorkOS AuthKit OAuth on /mcp. Leave
      # unset to keep the server open (default). See README for setup.
      - key: AUTHKIT_DOMAIN
        sync: false
      - key: MCP_RESOURCE_URL
        sync: false
      - key: SUPPORTBRIDGE_SOURCE
        value: claude-test-mcp
      - key: SUPPORTBRIDGE_URL
        value: https://supportbridge-development.onrender.com
      - key: SUPPORTBRIDGE_ENVIRONMENT
        value: development
      - key: SUPPORTBRIDGE_MODE
        value: observe-only
      - key: SUPPORTBRIDGE_API_KEY
        sync: false
